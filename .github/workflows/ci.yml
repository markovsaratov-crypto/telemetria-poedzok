# CI: проверки качества на каждый push в main и на каждый PR.
# Деплой НЕ из этого workflow (рунбук docs/OPERATIONS.md §14.3: d1-gateway —
# PUT бандла через Workers API; сайт — opennextjs-build по §16). CI = вторая
# линия: видим сломанный main сразу (типы/линт/тесты/секреты/воркер), а не по
# ошибке рантайма на проде.
#
# v3.3 (CR-J, кодревью топ-архитектора):
#  • + ШАГ «Secrets scan» (scripts/check-secrets.sh — теперь и голые
#    hex-константы ≥40 в исходниках; инцидент F-01: прод-секрет шлюза в
#    публичном репо 20.09–25.09, сканер не был подключён к CI).
#  • + ШАГ «Cloudflare Worker bundle check»: единственный код в критическом
#    пути прода (d1-gateway: инжест + кроны + FM-движки с DELETE) теперь
#    бандлится esbuild'ом и проходит node --check — зелёный CI больше не
#    пропускает синтаксически битый деплой-артефакт (F-03).
#  • npm install → npm ci (воспроизводимость сборки), timeout-minutes 15,
#    concurrency: main — queue (полный прогон), PR — отмена устаревших.
#  • УРОК ТРАНСПОРТА (из ревью): вывод инструментов отображает пару "[m"
#    с артефактом "ain]" — с первого дня репо в ci.yml ЗДЕСЬ стоит
#    branches: [main] (байт-верифицировано ord-кодами 91,109,97,105,110,93
#    и в рабочем дереве, и в коммите 5304962). Триггер push работает.
#    Правило: строки с "["-последовательностями сверять байтами (python
#    ord), не глазами.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# v3.3 (CR-J): не ронять идущий прогон main новым push (queue), в PR —
# устаревшие прогоны отменять.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # v3.4 (CR-J): установка — BUN по bun.lock (lockfile-точно; как backup.yml).
      # npm ci падал: package-lock.json в репо РАССИНХРОНИЗИРОВАН с package.json
      # (@opennextjs/cloudflare, wrangler, esbuild ставились через bun — живёт
      # bun.lock; npm-lock стух). setup-node оставлен: npx-тулинг (tsc/eslint/
      # vitest/prisma/esbuild) идёт под Node 22, node_modules от bun совместим.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (bun — lockfile-точно)
        run: bun install --frozen-lockfile
      - name: Secrets scan (env-файлы, токен-паттерны, голые hex-константы)
        run: bash scripts/check-secrets.sh
      - name: Cloudflare Worker bundle check (esbuild + node --check)
        run: |
          npx esbuild cloudflare-worker/d1-gateway.js --bundle --format=esm --platform=neutral --outfile=/tmp/gateway-bundle.js
          node --check /tmp/gateway-bundle.js
          echo "gateway bundle OK: $(wc -c < /tmp/gateway-bundle.js) bytes"
      - name: Prisma generate (типы клиента, без БД)
        run: npx prisma generate
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Typecheck тестов (tsconfig.test.json — tests/ вне прод-сборки)
        run: npx tsc --noEmit -p tsconfig.test.json
      - name: Lint (eslint)
        run: npx eslint .
      - name: Unit tests (vitest)
        run: npx vitest run
