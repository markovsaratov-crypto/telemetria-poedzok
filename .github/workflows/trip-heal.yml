# .github/workflows/trip-heal.yml — GHA-движок лечения «кусков поездок» (CR-G).
#
# ЗАЧЕМ ЗДЕСЬ (а не в воркере): CF API-токен песочницы не имеет права PUT
# workers/scripts (проверено 2026-10-01) — редеплой d1-gateway недоступен,
# а три корневые причины фрагментации (docs/OPERATIONS.md §14) чинить надо
# СЕЙЧАС. Шлюз d1-gateway принимает SQL через POST /query|/batch по секрету
# (D1_GATEWAY_SECRET, тот же канал, что у backup.yml) — движок живёт здесь.
# Репозиторий публичный → лимит минут GHA не расходуется.
#
# РАСПИСАНИЕ: */5 — зеркалит каденс FM-движков воркера (adopt/merge каждые
# 5 мин): мусорные артефакты живут в UI ≤ ~10 мин до выметания. Расход
# чтений D1 ~2-3К строк/прогон (~0.7М/день) — в бюджете free-плана (5М).
#
# ПОСЛЕ ДЕПЛОЯ d1-gateway v3.1 (OPERATIONS.md §14): cron ниже ОТКЛЮЧИТЬ
# (закомментировать расписание), workflow_dispatch оставить как ручной
# инструмент/страховку — движки переедут в воркер.
name: trip-heal

# CR-I (03.10, деплой d1-gateway v3.2): крон ОТКЛЮЧЁН — движки лечения
# (retire F7 / softDelete F10 / adopt F6 / merge F8=900 / tsw-прогрев 10 мин)
# переехали в воркер и тикают каждую минуту. workflow_dispatch — ручной
# инструмент/страховка (dry-run доступен). Самоцепочка chain=true — для
# аварийного временного каданса, если воркер-движки лягут.
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать план (без записей в БД)"
        type: boolean
        default: false
      deep:
        description: "Глубокая чистка (окно сирот 30 дней вместо 2)"
        type: boolean
        default: false
      chain:
        description: "Самоцепочка: по завершении подождать и диспетчеризовать следующий прогон (каденс ~5 мин без деградировавшего GHA-cron; CR-H)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: trip-heal
  cancel-in-progress: false # не рвать идущий прогон

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run trip-heal (retire fake trips → soft-delete standing orphans → merge undercut pairs → device-silence audit)
        env:
          D1_GATEWAY_URL: https://d1-gateway.markov-saratov.workers.dev
          D1_GATEWAY_SECRET: ${{ secrets.D1_GATEWAY_SECRET }}
          TRIP_MERGE_MAX_SEC: "900" # CR-I: единый порог по METHODOLOGY.md (= TRIP_SPLIT_SEC; 1800 давало флип-флоп сплит-vs-merge)
          HEAL_TZ: Europe/Saratov
          APP_ORIGIN: https://poedzok.fun
          HEAL_DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          HEAL_DEEP: ${{ inputs.deep == true && 'true' || 'false' }}
        run: bun scripts/trip-heal.ts

      - name: Chain dispatch (самоцепочка ~5 мин, CR-H)
        if: ${{ !cancelled() && inputs.chain == true }} # CR-I: цепочка переживает сбой шага heal (кейс 13:09 03.10 — транзиентный сокет убил цепочку)
        env:
          GH_PAT: ${{ secrets.HEAL_DISPATCH_PAT }}
        run: |
          echo "chain mode: sleep 240s, then dispatch next run"
          sleep 240
          code=$(curl -s -o /tmp/d.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/markovsaratov-crypto/telemetria-poedzok/actions/workflows/trip-heal.yml/dispatches" \
            -d '{"ref":"main","inputs":{"chain":true}}')
          echo "dispatch -> HTTP $code"
          cat /tmp/d.json || true
          if [ "$code" != "204" ]; then echo "::warning::chain dispatch failed ($code) — цепочка прервётся; рестарт: workflow_dispatch с chain=true"; fi
