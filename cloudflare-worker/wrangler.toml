# cloudflare-worker/wrangler.toml — v2.39.1 (§B1+§B2): конфиг деплоя
# d1-gateway-воркера. Актуален для wrangler v4: `bunx wrangler deploy`
# из этой папки (требует CLOUDFLARE_API_TOKEN с правом Workers Scripts:Edit;
# D1-API-прав у токена НЕ нужно — доступ к БД идёт через биндинг).
#
# Биндинги:
#   DB             — Cloudflare D1 «telemetria» (9dec0a90-…, см. docs/OPERATIONS.md §5)
#   KV             — неймспейс telemetria-kvcache-probe (§B2: кэш SELECT 60с+)
#   GATEWAY_SECRET — секрет шлюза (секрет, задаётся `wrangler secret put`)
#   INGEST_TOKEN   — токен Sensor Logger для /ingest (§B1, `wrangler secret put`)
#
# Секреты ЗДЕСЬ не хранятся: `bunx wrangler secret put GATEWAY_SECRET`,
# `bunx wrangler secret put INGEST_TOKEN`, `bunx wrangler secret put
# SESSION_SECRET` (значения — из рунбука ротации
# docs/SECURITY-ROTATION.md; должны совпадать с Render-инстансом приложения).
name = "d1-gateway"
main = "d1-gateway.js"
compatibility_date = "2026-09-01"
account_id = "b8e4eee2f19ba22f8d9ccce80691e719"
workers_dev = true

# v3 (CR-C F1, 2026-09-30): расписание СХЛОПНУТО до двух триггеров.
# Прежние 5 (см. git history / docs/OPERATIONS.md §13):
#   "*/1 * * * *" (tick), "*/5 * * * *" (finalize+alerts+turso),
#   "0 3 * * *" (retention), "30 3 * * *" (backup), "0 4 * * SUN" (backup-github).
# Что убрано и почему:
#   • "*/5" — свёрнут в тик: код scheduled() запускает finalize-sessions /
#     alerts / turso-migrate ИЗ минутного тика на минутах %5===0 (последовательно,
#     каждый в своём try/catch) — раньше */1 и */5 вызывали приложение ДВАЖДЫ
#     в одну минуту :00/:05/:10…;
#   • "30 3" backup и "0 4 * * SUN" backup-github — in-worker полный дамп
#     (64+ МБ) упирается в CPU-лимит free-плана (1102, §12): бэкап живёт
#     ТОЛЬКО в GitHub Actions (.github/workflows/backup.yml, cron 03:30 UTC).
# ВАЖНО: расписания на проде меняются НЕ этим файлом, а PUT
# /accounts/{acc}/workers/scripts/d1-gateway/schedules (см. §13).
[triggers]
crons = [
  "*/1 * * * *",    # worker-tick (TrafficJob/ExportJob/жнецы) + на %5-минутах
                     # finalize-sessions+alerts+turso-migrate + FM-движок
                     # (adopt/merge/tsw — d1-gateway.js, блок fm*)
  "0 3 * * *",      # retention (чистка по grace/purgedAt)
]

[[d1_databases]]
binding = "DB"
database_name = "telemetria"
database_id = "9dec0a90-7d38-46ae-9921-29eb83706b3d"

[[kv_namespaces]]
binding = "KV"
id = "be49735094b14ad3a41e053c4b1cd308"

[vars]
# §B1: rollup-инкременты edge-инжеста (OFF → Session/GpsPoint пишутся, StatsRollup нет)
EDGE_INGEST_ROLLUP_ENABLED = "true"
# §A1.5: TZ оператора для rollup-дня (должен совпадать с TELEMAT_TIMEZONE приложения)
TELEMAT_TIMEZONE = "Europe/Saratov"
# Лимит тела /ingest (байт); дефолт модуля 1 МБ — приведён явно для прозрачности
EDGE_INGEST_MAX_BYTES = "1048576"
# §B5: origin приложения для cron-вызовов исполнителей (poedzok.fun → TurboFlare → Render;
# после перевода домена на Cloudflare — тот же URL, но терминируется site-воркером)
APP_ORIGIN = "https://poedzok.fun"
# §T-DELTA: HTTP-endpoint Turso (libSQL over HTTP v2/pipeline — мигратор дельты)
TURSO_URL = "https://tele-markovsaratov-crypto.aws-ap-south-1.turso.io"
# v3.2+ (CR-I, РЕВЬЮ F-02/CR-J): ЖИВЫЕ прод-биндинги продублированы в конфиг —
# раньше они существовали ТОЛЬКО через Workers API (PUT деплоя), и `wrangler
# deploy` из этого файла молча откатывал оба дорогих фикса к дефолтам кода:
#   SESSION_GAP_MS=900000 — склейка фоновых сердцебиений телефона (5 мин) в
#   ОДНУ запись вместо фабрики сирот (RC2: дефолт 60 c < интервала фона).
#   FM_TRIP_MERGE_MAX_SEC=900 — политика склейки по METHODOLOGY.md §4.11
#   (merge-окно == split-порог = стабильный фикс-поинт; 1800 давал флип-флоп
#   «слил → re-split → куски снова»).
# ВНИМАНИЕ: значения здесь = значениям живого /settings воркера; при ротации
# менять ВЕЗДЕ синхронно (этот файл + PUT /settings + docs/OPERATIONS.md §14.3).
SESSION_GAP_MS = "900000"
FM_TRIP_MERGE_MAX_SEC = "900"

# Секреты (задаются ОБНОВЛЁННЫМИ значениями при ротации — Workers API или
# `wrangler secret put`): GATEWAY_SECRET, INGEST_TOKEN, CRON_SECRET (§B5:
# тот же секрет, что у приложения — cron-канал), TURSO_AUTH_TOKEN (§T-DELTA:
# JWT базы Turso — только на время миграции дельты, отозвать после статуса
# done через /admin/turso-migrate/status).

# v3 (CR-C F0): ВТОРОЙ секрет шлюза — GHA_GATEWAY_SECRET.
# Канал GitHub Actions (бэкап 03:30 UTC): workflow backup.yml шлёт заголовок
# x-gateway-secret со значением репо-секрета D1_GATEWAY_SECRET, а код шлюза
# принимает ЛЮБОЙ из GATEWAY_SECRET | GHA_GATEWAY_SECRET (оба constant-time;
# не задан/пуст → вторая проверка пропускается — см. gatewaySecretChannel в
# d1-gateway.js). ЗНАЧЕНИЕ В РЕПО НЕ ХРАНИТСЯ: генерируется при деплое
# (например 43 символа base62: openssl rand -base64 32 | tr -dc 'A-Za-z0-9')
# и подставляется ЯВНЫМ биндингом при PUT /workers/scripts/d1-gateway
# (Workers API), синхронно с PUT репо-секрета D1_GATEWAY_SECRET
# (libsodium sealed box, рецепт — docs/OPERATIONS.md §13). Пример для
# локального wrangler-деплоя (не для прода — там API-метод):
#   GHA_GATEWAY_SECRET = "<сгенерировать при деплое — см. §13>"
#
# v3.3 (CR-J): GHA_GATEWAY_SECRET деплоится биндингом secret_text (был
# plain_text — читался из GET /settings любым токеном с правом чтения
# настроек воркера). Канальные привилегии: GHA — read-only по умолчанию;
# аварийный DML — временный биндинг GATEWAY_GHA_DML="true" (рунбук §14.3),
# таблица User на GHA-канале read-only ВСЕГДА (см. ghaUserDmlViolation).
# GATEWAY_GHA_DML здесь НЕ задан (= «выключен» — fail-closed).
