services:
  - type: web
    name: telemetria-poedzok
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && DATABASE_URL="file:./db/local.db" npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: libsql://tele-markovsaratov-crypto.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: LOGIN_PASSWORD
        sync: false
      # v2.20.0: регистрация новых аккаунтов (POST /api/auth/register + форма в UI).
      # Новые аккаунты — строго role="user" (AUDIT B-1), админ только вручную в БД.
      # v2.38.1 (ревью F6): в проде ВЫКЛЮЧЕНА — single-user модель, заявленная в
      # доках и env-дефолте (false), теперь соответствует факту. Открытая
      # регистрация = спам-аккаунты + расход квоты D1 через личные apiKey.
      # Онбординг нового пользователя: временно выставить true в дашборде Render
      # (env-дашборд приоритетнее файла), зарегистрировать, вернуть false.
      - key: REGISTRATION_ENABLED
        value: "false"
      # v2.26.0 (ТЗ §13): сущность Trip включена — поездки назначаются сервером
      - key: TRIP_ENABLED
        value: "true"
      - key: SESSION_SECRET
        sync: false
      - key: API_KEY
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: RATE_LIMIT_MAX_INGEST
        value: "120"
      - key: RATE_LIMIT_MAX_DEFAULT
        value: "60"
      - key: RATE_LIMIT_MAX_AUTH
        value: "5"
      - key: RATE_LIMIT_MAX_REQUEUE
        value: "10"
      - key: RATE_LIMIT_BACKEND
        value: memory
      - key: MAX_PAYLOAD_BYTES
        value: "262144"
      - key: WORKER_ID
        value: worker-render-01
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: CIRCUIT_BREAKER_THRESHOLD
        value: "5"
      - key: CIRCUIT_BREAKER_TIMEOUT_SEC
        value: "30"
      - key: RETENTION_DAYS
        value: "3650"
      - key: GRACE_PERIOD_DAYS
        value: "30"
      - key: AUDIT_RETENTION_DAYS
        value: "3650"
      - key: EXPORT_ASYNC_THRESHOLD
        value: "5000"
      - key: BACKUP_STORAGE_DIR
        value: /tmp/backups
      - key: TARGET_LOAD_RPM
        value: "100"
      - key: APP_VERSION
        value: "2.38.0"
      # v2.38.0 (оптимизация чтений D1): кэш статов поездок in-memory,
      # подпись корпуса EcoScore. v2.37.0 (миграция Turso → D1): SQL-шлюз через Cloudflare Workers.
      # Значения живут в .env.production.local (next start подгружает его сам);
      # здесь — документация конфигурации. SECRET в дашборде НЕ задаём —
      # приоритет env-дашборда выше файла, дублирование не нужно.
      - key: D1_GATEWAY_URL
        value: https://d1-gateway.markov-saratov.workers.dev
      - key: D1_GATEWAY_SECRET
        sync: false
      # v2.16.0 (V7): read-скоп 240/мин — синхронизирован с env-дефолтом
      # (v2.14.1+ код его использует, в yaml значения не было)
      - key: RATE_LIMIT_MAX_READ
        value: "240"
      # v2.9: MovingTime state machine (§4.6 методологии)
      - key: MOVING_TIME_HYSTERESIS_HIGH_KMH
        value: "5"
      - key: MOVING_TIME_HYSTERESIS_LOW_KMH
        value: "2"
      - key: MOVING_TIME_DEBOUNCE_SEC
        value: "5"
      - key: MOVING_TIME_GAP_SEC
        value: "30"
      # v2.36.0 (§4.6а): разреженное движение — порог перемещения (м) для
      # интервала тишины > 30 с (кейс 15.09 «блипы»)
      - key: SPARSE_MOVE_MIN_M
        value: "75"
      # v2.9: CAP EcoScore (§7.3)
      - key: ECO_SCORE_CAP_BASELINE
        value: ""
      - key: ECO_SCORE_CAP_PENALTY_EXPONENT
        value: "2"
        # v2.38.2 (ревью F65): приведено к методологии §7.3 — штраф в квадрате;
        # прежнее значение 1.5 было расхождением код/дока
      - key: ECO_SCORE_MIN_CALIBRATION_CORPUS
        value: "30"
      - key: ECO_SCORE_MIN_BASELINE_VALUE
        value: "0.05"
      - key: ECO_SCORE_MIN_ACTIVE_DISTANCE_KM
        value: "5"
      - key: ECO_SCORE_MIN_ACTIVE_DURATION_SEC
        value: "300"
      # v2.9: HMM map matching (§17.2)
      - key: HMM_EMISSION_SIGMA_M
        value: "5"
      - key: HMM_TRANSITION_BETA_M
        value: "5"
      # v2.9: Theil-Sen RouteTrend (§10.5)
      - key: ROUTE_TREND_BOOTSTRAP_THRESHOLD
        value: "200"
      - key: ROUTE_TREND_BOOTSTRAP_SAMPLES
        value: "200"
      # v2.9: HotspotSegments P75 (§10.6)
      - key: HOTSPOT_SEGMENTS_PERCENTILE
        value: "75"
      - key: HOTSPOT_SEGMENTS_THRESHOLD
        value: "0.5"
      # v2.9: routeHash snap-to-grid (§10.0)
      - key: ROUTE_ID_SNAP_GRID_DEG
        value: "0.0005"
      # v2.10.0: external services (sync: false — задаётся в дашборде Render)
      - key: TWO_GIS_API_KEY
        sync: false
      - key: TWO_GIS_PROXY_URL
        value: ""
      - key: GH_TOKEN
        sync: false
      - key: GH_REPO
        value: markovsaratov-crypto/telemetria-poedzok
      - key: GH_BRANCH
        value: main
      - key: SLACK_WEBHOOK_URL
        sync: false

  # P1-10: retention-cron (§3.7) — ежедневная чистка по grace/purgedAt.
  # BASE_URL и CRON_SECRET задаются в дашборде Render (sync: false значения не подтягиваются в cron-сервис автоматически).
  - type: cron
    name: telemetria-retention-cron
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "0 3 * * *"
    buildCommand: echo "cron: no build needed"
    startCommand: curl -sf -X POST "$BASE_URL/api/cron/retention" -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # P2-16: alerts-cron (§14.4) — оценка правил алертов каждые 5 минут.
  # BASE_URL, CRON_SECRET и SLACK_WEBHOOK_URL (опционально) задаются в дашборде Render.
  - type: cron
    name: telemetria-alerts-cron
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "*/5 * * * *"
    buildCommand: echo "cron: no build needed"
    startCommand: curl -sf -X POST "$BASE_URL/api/cron/alerts" -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false

  # v2.10.0: backup-cron (§13.2) — ежедневный бэкап в 03:30 UTC (после retention 03:00).
  # v2.11.0 (АУДИТ C-3): крон шлёт CRON_SECRET — прокси и роут принимают его для POST бэкапов (раньше требовался ADMIN_TOKEN → ежедневные автобэкапы падали 401).
  - type: cron
    name: telemetria-backup-cron
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "30 3 * * *"
    buildCommand: echo "cron: no build needed"
    startCommand: curl -sf -X POST "$BASE_URL/api/admin/backup" -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: GH_REPO
        value: markovsaratov-crypto/telemetria-poedzok

  # v2.10.0: github-backup-cron (§13.3) — еженедельная ВС 04:00 UTC.
  # v2.32.0: ЕЖЕДНЕВНАЯ durable-копия делается КОДОМ в POST /api/admin/backup
  # (ежедневный backup-кron 03:30: дамп → аплоад того же дампа в GitHub →
  # read-back drill; расписание крон-сервисов НЕ менялось — расписание в
  # render.yaml требует ручного подтверждения blueprint-синка в дашборде
  # Render). Этот еженедельный крон остаётся страховкой: если ночной аплоад
  # из backup-крона не удался, ВС 04:00 повторит его независимо.
  # Создает Release в markovsaratov-crypto/telemetria-poedzok с asset (snapshot БД).
  - type: cron
    name: telemetria-github-backup-cron
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "0 4 * * 0"
    buildCommand: echo "cron: no build needed"
    startCommand: curl -sf -X POST "$BASE_URL/api/admin/backup/github" -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: GH_REPO
        value: markovsaratov-crypto/telemetria-poedzok

  # v2.10.0: finalize-sessions-cron (§4.8) — каждые 5 минут закрывает зависшие
  # recording-сессии и проставляет endTime (state machine).
  # v2.38.1 (ревью F8): порог — ≥10 мин тишины (max(10 мин, SESSION_GAP_MS×10),
  # env FINALIZE_STALE_MS) — раньше 60 с по wall-clock резал живые записи при
  # сетевой паузе и отменял фикс R4; расписание */5 оставлено: cron проверяет
  # часто, ФИНАЛИЗИРУЕТ только давно-тихие.
  - type: cron
    name: telemetria-finalize-sessions-cron
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "*/5 * * * *"
    buildCommand: echo "cron: no build needed"
    startCommand: curl -sf -X POST "$BASE_URL/api/cron/finalize-sessions" -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
